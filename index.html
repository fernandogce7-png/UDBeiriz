<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#5cc0e0;
  --blue-deep:#1c7fa3;
  --gold:#ffd400;
  --gold-deep:#e0ac00;
  --ink:#07141c;
  --bg-0:#061217;
  --bg-1:#0a1f2b;
  --bg-2:#0f2a3a;
  --card:#0f2733;
  --card-hi:#123243;
  --white:#f4fbff;
  --muted:#7fa3b3;
  --danger:#ff5d6c;
  --ok:#3ee08e;
  --ok-deep:#1a8a56;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
body{
  background:
    radial-gradient(ellipse 600px 400px at 15% -5%, rgba(92,192,224,0.16), transparent 60%),
    radial-gradient(ellipse 500px 400px at 100% 0%, rgba(255,212,0,0.10), transparent 55%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 30%, var(--bg-0) 100%);
  color:var(--white);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}

header{
  padding:calc(env(safe-area-inset-top) + 20px) 20px 16px 20px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, rgba(6,18,23,0.97), rgba(6,18,23,0.86) 80%, transparent);
  backdrop-filter:blur(10px);
}
.crest{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 10px rgba(0,0,0,0.5));flex-shrink:0;}
.htxt{flex:1;min-width:0;}
.htxt .club{font-size:10.5px;text-transform:uppercase;letter-spacing:0.12em;color:var(--blue);font-weight:700;}
.htxt h1{margin:1px 0 0 0;font-size:19px;font-weight:800;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.htxt h1 span{color:var(--gold);}

.tabs{
  display:flex;gap:8px;
  padding:4px 20px 14px 20px;
  position:sticky; top:78px; z-index:19;
  background:linear-gradient(180deg, rgba(6,18,23,0.9), transparent);
}
.tab{
  flex:1;text-align:center;padding:11px 4px;border-radius:12px;
  font-weight:700;font-size:13px;color:var(--muted);
  background:var(--card);border:1px solid rgba(255,255,255,0.05);
  cursor:pointer;user-select:none;transition:all .15s;
}
.tab.active{
  background:linear-gradient(140deg, var(--blue-deep), #135e79);
  color:var(--white);border-color:rgba(92,192,224,0.5);
  box-shadow:0 6px 18px -8px rgba(92,192,224,0.5);
}
.tab .count{display:inline-block;margin-left:4px;font-size:11px;background:rgba(255,255,255,0.14);padding:1px 7px;border-radius:999px;}

.subheader{
  display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;
  padding:0 20px 10px 20px;
  max-width:560px;margin:0 auto;width:100%;
}
.ghost-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid rgba(255,255,255,0.08);
  color:var(--blue);font-weight:700;font-size:12.5px;
  padding:8px 14px;border-radius:999px;cursor:pointer;
}
.ghost-btn svg{width:14px;height:14px;}

main{flex:1;padding:0 20px 130px 20px;max-width:560px;width:100%;margin:0 auto;}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:40px;margin-bottom:10px;}
.empty-state p{font-size:14.5px;line-height:1.6;margin:6px 0 0 0;}

.list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}

.card{
  background:linear-gradient(160deg, var(--card-hi), var(--card));
  border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);
  padding:15px 16px;
  display:flex;flex-direction:column;gap:10px;
  animation:pop .22s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.card.paid{opacity:0.62;}
.card-row{display:flex;gap:12px;align-items:flex-start;}
.card-body{flex:1;min-width:0;}
.card-athlete{font-size:15.5px;font-weight:700;line-height:1.35;word-break:break-word;color:var(--gold);}
.card-title{font-size:14.5px;font-weight:500;line-height:1.4;word-break:break-word;white-space:pre-wrap;color:var(--white);margin-top:2px;}
.card.paid .card-title, .card.paid .card-athlete{text-decoration:line-through;}
.card-date{font-size:16.5px;font-weight:700;color:var(--white);}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

.card-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tag{padding:2px 8px;border-radius:999px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
.tag.unpaid{background:rgba(255,93,108,0.12);color:var(--danger);border:1px solid rgba(255,93,108,0.32);}
.tag.paid{background:rgba(62,224,142,0.12);color:var(--ok);border:1px solid rgba(62,224,142,0.32);}
.tag.count-tag{background:rgba(92,192,224,0.12);color:var(--blue);border:1px solid rgba(92,192,224,0.32);}

.icon-btn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-btn:active{background:rgba(255,255,255,0.08);}
.icon-btn svg{width:17px;height:17px;}
.icon-btn.del:active{color:var(--danger);}

.card-actions{display:flex;gap:8px;padding-top:2px;}
.pill-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 0;border-radius:10px;border:none;
  font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.pill-btn svg{width:14px;height:14px;}
.pill-pay{background:linear-gradient(135deg, var(--ok), var(--ok-deep));color:#052717;}
.pill-pay.is-paid{background:var(--bg-2);color:var(--ok);border:1px solid rgba(62,224,142,0.35);}
.pill-send{background:var(--bg-2);color:var(--blue);border:1px solid rgba(92,192,224,0.3);}
.pill-open{background:linear-gradient(135deg, var(--blue-deep), #135e79);color:var(--white);}
.pill-btn:active{transform:scale(0.97);}

.fab{
  position:fixed;right:22px;bottom:calc(24px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(145deg, var(--gold), var(--gold-deep));color:var(--ink);border:none;
  box-shadow:0 14px 30px -8px rgba(255,212,0,0.55), 0 2px 6px rgba(0,0,0,0.3);
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:400;
  cursor:pointer;z-index:30;transition:transform .15s;
}
.fab:active{transform:scale(0.92);}

.email-bar{
  position:fixed;left:0;right:0;bottom:0;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom)) 20px;
  background:linear-gradient(0deg, rgba(6,18,23,0.98) 60%, rgba(6,18,23,0.85), transparent);
  z-index:25;display:flex;gap:10px;justify-content:center;
}
.email-btn{
  max-width:560px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(135deg, var(--blue-deep), #0d4e63);color:var(--white);
  border:1px solid rgba(92,192,224,0.4);padding:14px 18px;border-radius:14px;
  font-weight:700;font-size:14.5px;cursor:pointer;
  box-shadow:0 12px 28px -12px rgba(28,127,163,0.6);
}
.email-btn:active{transform:scale(0.98);}
.email-btn svg{width:19px;height:19px;flex-shrink:0;}

.overlay{
  position:fixed;inset:0;background:rgba(3,8,11,0.72);backdrop-filter:blur(3px);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  background:linear-gradient(165deg, #123243, #0c2431);
  width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom)) 20px;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.3,1);
  border-top:1px solid rgba(255,255,255,0.08);
  max-height:85vh;overflow-y:auto;
}
.overlay.show .sheet{transform:translateY(0);}
.sheet h2{margin:0 0 16px 0;font-size:18px;}
.field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:700;margin:4px 0 7px 2px;}
.sheet input[type=text], .sheet input[type=date]{
  width:100%;background:var(--bg-0);border:1.5px solid rgba(255,255,255,0.1);border-radius:13px;
  padding:13px 14px;color:var(--white);font-family:inherit;font-size:15.5px;margin-bottom:14px;
  -webkit-appearance:none;
}
.sheet input[type=text]:focus, .sheet input[type=date]:focus{outline:none;border-color:var(--gold);}
.sheet textarea{
  width:100%;min-height:80px;background:var(--bg-0);border:1.5px solid rgba(255,255,255,0.1);
  border-radius:13px;padding:13px 14px;color:var(--white);font-family:inherit;font-size:15.5px;
  resize:vertical;line-height:1.5;
}
.sheet textarea:focus{outline:none;border-color:var(--blue);}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.sheet-actions button{flex:1;padding:14px 0;border-radius:13px;border:none;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}
.btn-cancel{background:var(--bg-2);color:var(--muted);}
.btn-save{background:var(--gold);color:var(--ink);}
.btn-save:disabled{opacity:0.4;}

.roster-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.roster-row span{flex:1;font-size:15px;font-weight:600;}
.add-row{display:flex;gap:8px;margin-top:12px;}
.add-row input{flex:1;margin-bottom:0 !important;}
.add-row button{
  background:var(--gold);color:var(--ink);border:none;border-radius:12px;
  width:46px;font-size:22px;font-weight:700;cursor:pointer;flex-shrink:0;
}

.attend-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);
}
.attend-row .aname{font-size:15px;font-weight:600;flex:1;}
.attend-toggle{
  display:flex;background:var(--bg-0);border-radius:10px;padding:3px;border:1px solid rgba(255,255,255,0.08);flex-shrink:0;
}
.attend-toggle button{
  border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;
  font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;
}
.attend-toggle button.on.present{background:var(--ok);color:#052717;}
.attend-toggle button.on.absent{background:var(--danger);color:#2b0409;}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translate(-50%,16px);
  background:var(--ok);color:#052717;font-weight:700;font-size:13.5px;
  padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;
  transition:all .25s ease;box-shadow:0 10px 26px -8px rgba(0,0,0,0.5);z-index:50;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

<script>
const EMAIL_TO = "udbeirizsub12@gmail.com";

let items = [];      // mensalidades: {id, athlete, text, paid, ts}
let players = [];    // roster: array of strings
let trainings = [];  // {id, date:'YYYY-MM-DD', attendance:{playerName:boolean}, ts}

let currentTab = 'mensalidades';
let importedWorkbook = null;   // XLSX workbook object, loaded from a chosen file
let importedFileName = null;   // original file name, reused when exporting

function loadAll(){
  try{ items = JSON.parse(localStorage.getItem('udb_mensalidades')||'[]'); }catch(e){ items=[]; }
  try{ players = JSON.parse(localStorage.getItem('udb_players')||'[]'); }catch(e){ players=[]; }
  try{ trainings = JSON.parse(localStorage.getItem('udb_trainings')||'[]'); }catch(e){ trainings=[]; }
  render();
}
function saveItems(){ localStorage.setItem('udb_mensalidades', JSON.stringify(items)); }
function savePlayers(){ localStorage.setItem('udb_players', JSON.stringify(players)); }
function saveTrainings(){ localStorage.setItem('udb_trainings', JSON.stringify(trainings)); }

function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDatePT(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function formatSheetName(iso){
  const [y,m,d] = iso.split('-');
  return `${d}-${m}-${y}`;
}

/* ============ RENDER ============ */
function render(){
  document.getElementById('countMensalidades').textContent = items.length;
  document.getElementById('countPresencas').textContent = trainings.length;
  document.getElementById('subheader').style.display = currentTab==='presencas' ? 'flex' : 'none';
  document.getElementById('btnActionMens').style.display = currentTab==='mensalidades' ? 'flex' : 'none';
  document.getElementById('btnActionPres').style.display = currentTab==='presencas' ? 'flex' : 'none';

  const wrap = document.getElementById('listWrap');

  if(currentTab==='mensalidades'){
    renderMensalidades(wrap);
  }else{
    renderPresencas(wrap);
  }
}

function renderMensalidades(wrap){
  const filtered = items.slice().sort((a,b)=>b.ts-a.ts);
  if(filtered.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">€</div><p>Ainda não há mensalidades registadas.<br>Toca no botão dourado para adicionar a primeira.</p></div>`;
    return;
  }
  wrap.innerHTML = `<div class="list">${filtered.map(item=>{
    const dateTxt = new Date(item.ts).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'2-digit'});
    return `
    <div class="card ${item.paid?'paid':''}" data-id="${item.id}">
      <div class="card-row">
        <div class="card-body">
          <div class="card-athlete">${escapeHtml(item.athlete||'(sem nome)')}</div>
          ${item.text ? `<div class="card-title">${escapeHtml(item.text)}</div>` : ''}
          <div class="card-meta">
            <span class="tag ${item.paid?'paid':'unpaid'}">${item.paid?'Paga':'Por pagar'}</span>
            ${dateTxt}
          </div>
        </div>
        <button class="icon-btn del" data-action="delete-mens" data-id="${item.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="card-actions">
        <button class="pill-btn pill-pay ${item.paid?'is-paid':''}" data-action="pay" data-id="${item.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          ${item.paid ? 'Paga' : 'Pagar'}
        </button>
        <button class="pill-btn pill-send" data-action="send-mens" data-id="${item.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
          Enviar
        </button>
      </div>
    </div>`;
  }).join('')}</div>`;

  wrap.querySelectorAll('[data-action="pay"]').forEach(el=>{
    el.onclick = ()=>{
      const it = items.find(i=>i.id===el.dataset.id);
      it.paid = !it.paid; saveItems(); render();
      showToast(it.paid ? 'Mensalidade marcada como paga' : 'Marcada como por pagar');
    };
  });
  wrap.querySelectorAll('[data-action="delete-mens"]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); items = items.filter(i=>i.id!==el.dataset.id); saveItems(); render(); showToast('Eliminado'); };
  });
  wrap.querySelectorAll('[data-action="send-mens"]').forEach(el=>{
    el.onclick = ()=>{
      const it = items.find(i=>i.id===el.dataset.id);
      const subject = `UDB Sub-12 — Mensalidade de ${it.athlete}`;
      const body = `UD Beiriz — Sub-12\n\nMENSALIDADE\nAtleta: ${it.athlete}\n${it.text ? 'Referente a: '+it.text+'\n' : ''}Estado: ${it.paid ? 'Paga' : 'Por pagar'}\n`;
      window.location.href = `mailto:${EMAIL_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };
  });
}

function renderPresencas(wrap){
  const filtered = trainings.slice().sort((a,b)=> b.date.localeCompare(a.date));
  if(filtered.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">📋</div><p>Ainda não há sessões de treino registadas.<br>Toca no botão dourado para criar a primeira.${players.length===0 ? '<br><br>Dica: adiciona primeiro os jogadores em \"Gerir jogadores\" acima.' : ''}</p></div>`;
    return;
  }
  wrap.innerHTML = `<div class="list">${filtered.map(t=>{
    const presentCount = Object.values(t.attendance||{}).filter(Boolean).length;
    return `
    <div class="card" data-id="${t.id}">
      <div class="card-row">
        <div class="card-body">
          <div class="card-date">${formatDatePT(t.date)}</div>
          <div class="card-sub">Treino</div>
          <div class="card-meta">
            <span class="tag count-tag">${presentCount}/${players.length} presentes</span>
          </div>
        </div>
        <button class="icon-btn del" data-action="delete-train" data-id="${t.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="card-actions">
        <button class="pill-btn pill-open" data-action="open-train" data-id="${t.id}" style="flex:1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Marcar presenças
        </button>
      </div>
    </div>`;
  }).join('')}</div>`;

  wrap.querySelectorAll('[data-action="delete-train"]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); trainings = trainings.filter(t=>t.id!==el.dataset.id); saveTrainings(); render(); showToast('Sessão eliminada'); };
  });
  wrap.querySelectorAll('[data-action="open-train"]').forEach(el=>{
    el.onclick = ()=> openAttendanceSheet(el.dataset.id);
  });
}

/* ============ TABS ============ */
document.getElementById('tabMensalidades').onclick = ()=>{ currentTab='mensalidades'; setActiveTab(); };
document.getElementById('tabPresencas').onclick = ()=>{ currentTab='presencas'; setActiveTab(); };
function setActiveTab(){
  document.getElementById('tabMensalidades').classList.toggle('active', currentTab==='mensalidades');
  document.getElementById('tabPresencas').classList.toggle('active', currentTab==='presencas');
  render();
}

/* ============ OVERLAY / SHEET SYSTEM ============ */
const overlay = document.getElementById('overlay');
const sheetContent = document.getElementById('sheetContent');

function closeSheet(){ overlay.classList.remove('show'); }
overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };

function openSheetRaw(innerHtml){
  sheetContent.innerHTML = innerHtml;
  overlay.classList.add('show');
}

/* ---- New Mensalidade ---- */
function openNewMensalidade(){
  openSheetRaw(`
    <h2>Nova mensalidade</h2>
    <div class="field-label">Nome do Atleta</div>
    <input type="text" id="mAthlete" placeholder="Nome completo" list="playersList">
    <datalist id="playersList">${players.map(p=>`<option value="${escapeHtml(p)}">`).join('')}</datalist>
    <div class="field-label">Mês / Observações (opcional)</div>
    <textarea id="mText" placeholder="Ex: Setembro 2026"></textarea>
    <div class="sheet-actions">
      <button class="btn-cancel" id="mCancel">Cancelar</button>
      <button class="btn-save" id="mSave" disabled>Guardar</button>
    </div>
  `);
  const athleteEl = document.getElementById('mAthlete');
  const saveBtn = document.getElementById('mSave');
  athleteEl.oninput = ()=>{ saveBtn.disabled = athleteEl.value.trim().length===0; };
  document.getElementById('mCancel').onclick = closeSheet;
  saveBtn.onclick = ()=>{
    const athlete = athleteEl.value.trim();
    if(!athlete) return;
    items.push({id:uid(), athlete, text:document.getElementById('mText').value.trim(), paid:false, ts:Date.now()});
    saveItems(); closeSheet(); render();
    showToast('Mensalidade guardada');
  };
  setTimeout(()=>athleteEl.focus(), 200);
}

/* ---- Manage Players ---- */
function openManagePlayers(){
  renderManagePlayersSheet();
}
function renderManagePlayersSheet(){
  openSheetRaw(`
    <h2>Gerir jogadores</h2>
    <div id="rosterList">
      ${players.length===0 ? '<p style="color:var(--muted);font-size:13.5px;">Ainda não adicionaste nenhum jogador.</p>' : players.map((p,i)=>`
        <div class="roster-row">
          <span>${escapeHtml(p)}</span>
          <button class="icon-btn del" data-action="del-player" data-idx="${i}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>`).join('')}
    </div>
    <div class="add-row">
      <input type="text" id="newPlayerName" placeholder="Nome do jogador">
      <button id="addPlayerBtn">+</button>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="rosterClose" style="flex:1;">Fechar</button>
    </div>
  `);
  document.getElementById('rosterClose').onclick = closeSheet;
  document.querySelectorAll('[data-action="del-player"]').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.idx);
      const removed = players[idx];
      players.splice(idx,1); savePlayers();
      renderManagePlayersSheet();
      render();
      showToast(`${removed} removido`);
    };
  });
  const addBtn = document.getElementById('addPlayerBtn');
  const nameInput = document.getElementById('newPlayerName');
  const addPlayer = ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    players.push(name); savePlayers();
    renderManagePlayersSheet();
    render();
  };
  addBtn.onclick = addPlayer;
  nameInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addPlayer(); } };
  setTimeout(()=>nameInput.focus(), 200);
}

/* ---- New Training ---- */
function openNewTraining(){
  const today = new Date().toISOString().slice(0,10);
  openSheetRaw(`
    <h2>Nova sessão de treino</h2>
    <div class="field-label">Dia do treino</div>
    <input type="date" id="tDate" value="${today}">
    <div class="sheet-actions">
      <button class="btn-cancel" id="tCancel">Cancelar</button>
      <button class="btn-save" id="tSave">Criar e marcar presenças</button>
    </div>
  `);
  document.getElementById('tCancel').onclick = closeSheet;
  document.getElementById('tSave').onclick = ()=>{
    const date = document.getElementById('tDate').value;
    if(!date) return;
    const attendance = {};
    players.forEach(p=> attendance[p] = false);
    const newTraining = {id:uid(), date, attendance, ts:Date.now()};
    trainings.push(newTraining);
    saveTrainings();
    render();
    openAttendanceSheet(newTraining.id);
  };
}

/* ---- Attendance editor ---- */
function openAttendanceSheet(trainingId){
  const t = trainings.find(x=>x.id===trainingId);
  if(!t) return;
  if(!t.attendance) t.attendance = {};
  players.forEach(p=>{ if(!(p in t.attendance)) t.attendance[p] = false; });

  openSheetRaw(`
    <h2>Presenças — ${formatDatePT(t.date)}</h2>
    ${players.length===0 ? '<p style="color:var(--muted);font-size:13.5px;">Ainda não há jogadores na lista. Fecha e toca em \"Gerir jogadores\" para adicionar.</p>' : `
    <div id="attendList">
      ${players.map(p=>`
        <div class="attend-row">
          <span class="aname">${escapeHtml(p)}</span>
          <div class="attend-toggle" data-player="${escapeHtml(p)}">
            <button class="absent-btn ${!t.attendance[p]?'on absent':''}" data-val="0">Falta</button>
            <button class="present-btn ${t.attendance[p]?'on present':''}" data-val="1">Presente</button>
          </div>
        </div>
      `).join('')}
    </div>`}
    <div class="sheet-actions">
      <button class="btn-cancel" id="aCancel">Fechar</button>
      <button class="btn-save" id="aSave">Guardar</button>
    </div>
  `);

  document.getElementById('aCancel').onclick = closeSheet;
  document.querySelectorAll('.attend-toggle').forEach(tg=>{
    const p = tg.dataset.player;
    tg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        t.attendance[p] = btn.dataset.val === '1';
        tg.querySelector('.absent-btn').classList.toggle('on', !t.attendance[p]);
        tg.querySelector('.absent-btn').classList.toggle('absent', !t.attendance[p]);
        tg.querySelector('.present-btn').classList.toggle('on', t.attendance[p]);
        tg.querySelector('.present-btn').classList.toggle('present', t.attendance[p]);
      };
    });
  });
  document.getElementById('aSave').onclick = ()=>{
    saveTrainings();
    closeSheet();
    render();
    showToast('Presenças guardadas');
  };
}

/* ============ FAB ============ */
document.getElementById('fabAdd').onclick = ()=>{
  if(currentTab==='mensalidades') openNewMensalidade();
  else openNewTraining();
};
document.getElementById('btnManagePlayers').onclick = openManagePlayers;

/* ============ IMPORT EXISTING EXCEL ============ */
document.getElementById('btnImportExcel').onclick = ()=>{
  document.getElementById('importInput').click();
};
document.getElementById('importInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      importedWorkbook = wb;
      importedFileName = file.name;
      document.getElementById('importBtnLabel').textContent = `Ficheiro: ${file.name}`;
      showToast(`Importado — ${wb.SheetNames.length} aba(s) existentes`);
    }catch(err){
      showToast('Não consegui ler esse ficheiro');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ EMAIL: all mensalidades ============ */
document.getElementById('btnActionMens').onclick = ()=>{
  if(items.length===0){ showToast('Nada para enviar ainda'); return; }
  const mens = items.slice().sort((a,b)=>a.ts-b.ts);
  let body = 'UD Beiriz — Sub-12\n\nMENSALIDADES\n';
  mens.forEach(m=> body += `${m.paid ? '[PAGA]' : '[POR PAGAR]'} ${m.athlete}${m.text ? ' — '+m.text : ''}\n`);
  const subject = encodeURIComponent('UDB Sub-12 — Mensalidades');
  window.location.href = `mailto:${EMAIL_TO}?subject=${subject}&body=${encodeURIComponent(body)}`;
};

/* ============ EXPORT EXCEL: all trainings ============ */
document.getElementById('btnActionPres').onclick = ()=>{
  if(trainings.length===0){ showToast('Ainda não há sessões para exportar'); return; }
  if(typeof XLSX === 'undefined'){ showToast('Erro ao carregar Excel — verifica a internet'); return; }

  // start from the imported workbook if one was chosen, so existing sheets are kept
  const wb = importedWorkbook ? importedWorkbook : XLSX.utils.book_new();
  const sorted = trainings.slice().sort((a,b)=> a.date.localeCompare(b.date));
  const usedNames = {};
  sorted.forEach(t=>{
    const rows = [["Jogador","Presença"]];
    players.forEach(p=> rows.push([p, t.attendance && t.attendance[p] ? "Presente" : "Falta"]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:26},{wch:12}];
    let name = formatSheetName(t.date);
    if(usedNames[name]){ usedNames[name]++; name = name+'_'+usedNames[name]; } else { usedNames[name]=1; }
    name = name.slice(0,31);
    // if this date's sheet already exists (e.g. re-exporting after edits), replace it instead of duplicating
    const existingIdx = wb.SheetNames.indexOf(name);
    if(existingIdx !== -1){
      wb.Sheets[name] = ws;
    }else{
      XLSX.utils.book_append_sheet(wb, ws, name);
    }
  });

  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const fileName = importedFileName || 'UDB_Sub12_Presencas.xlsx';

  const file = (typeof File !== 'undefined') ? new File([blob], fileName, {type:blob.type}) : null;
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:'Presenças UDB Sub-12', text:'Presenças UDB Sub-12'}).catch(()=>{
      fallbackDownload(blob, fileName);
    });
  }else{
    fallbackDownload(blob, fileName);
  }
};

function fallbackDownload(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showToast('Ficheiro Excel transferido');
}

loadAll();
